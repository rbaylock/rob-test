<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>V-Taper 8-Week Tracker</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 105px; -webkit-tap-highlight-color: transparent; }
    button, select, input { touch-action: manipulation; }
    header { position: sticky; top: 0; z-index: 20; background: rgba(15, 23, 42, 0.96); backdrop-filter: blur(8px); padding: 12px 16px; border-bottom: 1px solid var(--card-border); }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
    .title-wrap { display: flex; flex-direction: column; }
    .title { font-size: 1.1rem; font-weight: 800; letter-spacing: -0.3px; color: var(--accent); }
    .status-pill { font-size: 0.7rem; color: var(--success); font-weight: 700; margin-top: 2px; }
    .week-select { background: var(--card); color: var(--text); border: 1px solid var(--accent); padding: 7px 10px; border-radius: 8px; font-weight: 700; font-size: 0.85rem; }
    .phase-banner { background: #172554; border-left: 4px solid var(--accent); padding: 8px 12px; border-radius: 6px; font-size: 0.78rem; color: #bae6fd; margin-bottom: 10px; line-height: 1.35; }
    .day-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .day-tab { background: var(--card); color: var(--muted); border: 1px solid var(--card-border); padding: 10px 4px; border-radius: 8px; font-weight: 700; font-size: 0.82rem; text-align: center; cursor: pointer; user-select: none; }
    .day-tab.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }
    main { padding: 12px 16px; max-width: 600px; margin: 0 auto; }
    .ex-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
    .ex-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
    .ex-name { font-size: 0.98rem; font-weight: 700; line-height: 1.25; }
    .ex-meta { font-size: 0.75rem; color: var(--accent); font-weight: 700; white-space: nowrap; background: rgba(56, 189, 248, 0.12); padding: 3px 8px; border-radius: 6px; }
    .ex-cue { font-size: 0.78rem; color: var(--muted); margin-bottom: 10px; line-height: 1.35; }
    .badge { display: none; font-size: 0.74rem; font-weight: 700; padding: 6px 8px; border-radius: 6px; margin-bottom: 10px; width: 100%; }
    .badge.show { display: block; }
    .badge.overload { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.4); }
    .badge.partials { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
    .set-header, .set-row { display: grid; grid-template-columns: 32px 1fr 76px 76px 44px; gap: 8px; align-items: center; margin-bottom: 8px; }
    .set-header { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; font-weight: 700; padding: 0 2px; }
    .set-num { font-size: 0.85rem; font-weight: 700; color: var(--muted); text-align: center; }
    .prev-log { font-size: 0.75rem; color: var(--muted); }
    input[type="number"] { width: 100%; background: #0f172a; border: 1px solid var(--card-border); color: var(--text); padding: 9px 6px; border-radius: 6px; text-align: center; font-size: 0.95rem; font-weight: 600; }
    input[type="number"]:focus { outline: none; border-color: var(--accent); }
    .done-btn { width: 42px; height: 38px; border-radius: 8px; border: 1px solid var(--card-border); background: #0f172a; color: var(--muted); font-size: 1.05rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; user-select: none; }
    .done-btn.checked { background: var(--success); border-color: var(--success); color: #052e16; }
    .timer-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #020617; border-top: 2px solid var(--accent); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 30; }
    .timer-display { font-size: 1.35rem; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--accent); }
    .timer-controls { display: flex; gap: 6px; }
    .timer-btn, .util-btn { background: var(--card); color: var(--text); border: 1px solid var(--card-border); padding: 8px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; cursor: pointer; }
    .timer-btn:active, .util-btn:active, .day-tab:active, .done-btn:active { transform: scale(0.96); }
    .util-bar { display: flex; justify-content: space-between; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--card-border); gap: 8px; }
  </style>
</head>
<body>

<header>
  <div class="top-bar">
    <div class="title-wrap">
      <div class="title">⚡ V-TAPER MESOCYCLE</div>
      <div id="statusPill" class="status-pill">● Loading...</div>
    </div>
    <select id="weekSelect" class="week-select">
      <option value="1">Week 1 • Calibration</option>
      <option value="2">Week 2 • Base Build</option>
      <option value="3">Week 3 • Base Build</option>
      <option value="4">Week 4 • +Volume Bump</option>
      <option value="5">Week 5 • +Volume Bump</option>
      <option value="6">Week 6 • Peak Overreach</option>
      <option value="7">Week 7 • Peak Overreach</option>
      <option value="8">Week 8 • Deload</option>
    </select>
  </div>
  <div id="phaseBanner" class="phase-banner"></div>
  <div class="day-tabs">
    <button type="button" class="day-tab active" data-action="day" data-day="0">Day 1: Upper/Quad</button>
    <button type="button" class="day-tab" data-action="day" data-day="1">Day 2: Delt/Post</button>
    <button type="button" class="day-tab" data-action="day" data-day="2">Day 3: Chest/Arms</button>
  </div>
</header>

<main>
  <div id="workoutContainer"></div>
  <div class="util-bar">
    <button type="button" class="util-btn" data-action="export">Export Backup (JSON)</button>
    <button type="button" class="util-btn" data-action="import">Import Backup</button>
    <input type="file" id="fileInput" accept=".json" style="display:none" />
  </div>
</main>

<div class="timer-bar">
  <div>
    <div style="font-size: 0.7rem; color: var(--muted); text-transform: uppercase; font-weight:700;">Rest Timer</div>
    <div id="timerDisplay" class="timer-display">00:00</div>
  </div>
  <div class="timer-controls">
    <button type="button" class="timer-btn" data-action="timer" data-sec="60">1:00</button>
    <button type="button" class="timer-btn" data-action="timer" data-sec="90">1:30</button>
    <button type="button" class="timer-btn" data-action="timer" data-sec="150">2:30</button>
    <button type="button" class="timer-btn" data-action="timer" data-sec="0" style="color:var(--danger);">Reset</button>
  </div>
</div>

<script>
(function() {
  const PROGRAM = [
    {
      day: "Day 1",
      exercises: [
        { id: "d1_inc_db", name: "Incline Dumbbell Press (30°)", type: "compound", baseSets: 3, minReps: 8, maxReps: 10, rest: 150, bumpSet: false, cue: "Deep 1-sec stretch at outer chest; First-Set Trigger." },
        { id: "d1_pullup", name: "Weighted Pull-Ups / Wide Pulldown", type: "compound", baseSets: 3, minReps: 8, maxReps: 12, rest: 150, bumpSet: false, cue: "Use straps on heavy sets; drive elbows down to hips." },
        { id: "d1_squat", name: "Hack Squat or Back Squat", type: "compound", baseSets: 3, minReps: 8, maxReps: 10, rest: 180, bumpSet: false, cue: "Feet lower/shoulder-width to bias outer quad sweep." },
        { id: "d1_cab_lat", name: "Cable Lateral Raises (Wrist Height)", type: "isolation", baseSets: 4, minReps: 12, maxReps: 15, rest: 75, bumpSet: true, cue: "Pull across body from wrist height; Full-Set Mastery." },
        { id: "d1_inc_curl", name: "Incline DB or Bayesian Cable Curl", type: "isolation", baseSets: 3, minReps: 10, maxReps: 12, rest: 75, bumpSet: false, cue: "Keep elbows pinned behind torso for long-head stretch." },
        { id: "d1_oh_tri", name: "Overhead Cable Rope Extension", type: "isolation", baseSets: 3, minReps: 10, maxReps: 15, rest: 75, bumpSet: true, cue: "Pause in deep stretch behind head before locking out." }
      ]
    },
    {
      day: "Day 2",
      exercises: [
        { id: "d2_sh_press", name: "Seated DB or Machine Shoulder Press", type: "compound", baseSets: 3, minReps: 8, maxReps: 10, rest: 150, bumpSet: false, cue: "Stop just short of lockout to keep constant delt tension." },
        { id: "d2_rdl", name: "Romanian Deadlift (RDL)", type: "compound", baseSets: 3, minReps: 8, maxReps: 10, rest: 180, bumpSet: false, cue: "Use wrist straps; push hips straight back with neutral spine." },
        { id: "d2_cs_row", name: "Chest-Supported Machine/DB Row", type: "compound", baseSets: 3, minReps: 10, maxReps: 12, rest: 120, bumpSet: false, cue: "Let shoulder blades protract fully at bottom." },
        { id: "d2_pec_deck", name: "Machine Pec Deck / Cable Fly", type: "isolation", baseSets: 3, minReps: 12, maxReps: 15, rest: 90, bumpSet: true, cue: "1-second pause in deep chest stretch." },
        { id: "d2_rev_pec", name: "Reverse Pec Deck / Face Pulls", type: "isolation", baseSets: 3, minReps: 15, maxReps: 20, rest: 75, bumpSet: true, cue: "Sweep weight out in wide arc to isolate rear delts." },
        { id: "d2_leg_raise", name: "Hanging Leg Raise / Cable Crunch", type: "isolation", baseSets: 3, minReps: 12, maxReps: 15, rest: 60, bumpSet: false, cue: "Curl pelvis up toward ribs; avoid swinging." }
      ]
    },
    {
      day: "Day 3",
      exercises: [
        { id: "d3_flat_press", name: "Flat Barbell or Machine Chest Press", type: "compound", baseSets: 3, minReps: 6, maxReps: 8, rest: 180, bumpSet: false, cue: "Heavy mechanical tension; 2-3 sec lowering phase." },
        { id: "d3_lat_pd", name: "Neutral-Grip Pulldown / Cable Row", type: "compound", baseSets: 3, minReps: 10, maxReps: 12, rest: 120, bumpSet: false, cue: "Drive elbows down and in to target lower lats." },
        { id: "d3_leg_curl", name: "Seated or Lying Leg Curl", type: "isolation", baseSets: 3, minReps: 10, maxReps: 15, rest: 90, bumpSet: false, cue: "Control eccentric; add 4-5 lengthened partials on last set." },
        { id: "d3_bss", name: "Bulgarian Split Squat or Leg Press", type: "compound", baseSets: 3, minReps: 10, maxReps: 12, rest: 120, bumpSet: false, cue: "Slight forward torso lean for glute/quad sweep." },
        { id: "d3_db_lat", name: "Dumbbell Lateral Raises", type: "isolation", baseSets: 4, minReps: 12, maxReps: 15, rest: 60, bumpSet: true, cue: "Raise slightly forward in scapular plane." },
        { id: "d3_arm_ss", name: "EZ Preacher Curl + Pushdown Superset", type: "isolation", baseSets: 3, minReps: 10, maxReps: 12, rest: 90, bumpSet: true, cue: "Log Curl weight/reps; perform Pushdowns immediately after." }
      ]
    }
  ];

  const WEEK_INFO = {
    1: { rirComp: "2–3 RIR", rirIso: "2 RIR", note: "Calibration Week: Establish clean baseline logbook weights." },
    2: { rirComp: "2 RIR", rirIso: "1 RIR (Last 0)", note: "Progression Base: Beat Week 1 by +1-2 reps or +5 lbs." },
    3: { rirComp: "2 RIR", rirIso: "1 RIR (Last 0)", note: "Progression Base: Hit top of rep range to trigger weight jump." },
    4: { rirComp: "1–2 RIR", rirIso: "0–1 RIR", note: "Aesthetic Volume Bump: +1 set automatically added to key isolations." },
    5: { rirComp: "1–2 RIR", rirIso: "0–1 RIR", note: "Aesthetic Volume Bump: Push isolation sets close to failure." },
    6: { rirComp: "1 RIR", rirIso: "0 RIR + Partials", note: "Peak Overreach: Perform 4-6 lengthened partials after failure on final set." },
    7: { rirComp: "0–1 RIR", rirIso: "0 RIR + Partials", note: "Peak Overreach: Empty the tank before next week's deload!" },
    8: { rirComp: "3–4 RIR", rirIso: "3–4 RIR", note: "Strategic Deload: 2 sets per exercise at ~85-90% of Week 7 weight." }
  };

  let state = { week: 1, day: 0, logs: {} };
  try {
    const saved = localStorage.getItem("vtaper_state_v1");
    if (saved) state = JSON.parse(saved);
  } catch (e) {}

  let timerInterval = null;
  let remainingSeconds = 0;

  function flashStatus(msg) {
    const pill = document.getElementById("statusPill");
    if (!pill) return;
    pill.textContent = msg;
    setTimeout(() => { pill.textContent = "● App Ready"; }, 1200);
  }

  function saveState() {
    try {
      localStorage.setItem("vtaper_state_v1", JSON.stringify(state));
      flashStatus("✓ Saved");
    } catch (e) {
      flashStatus("● Memory Mode");
    }
  }

  function getSetCount(ex, week) {
    if (week === 8) return 2;
    if (week >= 4 && week <= 7 && ex.bumpSet) return ex.baseSets + 1;
    return ex.baseSets;
  }

  function findEx(exId) {
    for (const d of PROGRAM) {
      for (const e of d.exercises) {
        if (e.id === exId) return e;
      }
    }
    return null;
  }

  function checkProgressionText(ex, week, numSets) {
    const logKey = "w" + week + "_" + ex.id;
    const sets = state.logs[logKey] || [];
    const validSets = [];
    for (let i = 0; i < numSets; i++) {
      if (sets[i] && Number(sets[i].reps) > 0) validSets.push(Number(sets[i].reps));
    }
    if (validSets.length < numSets) return "";

    if (ex.type === "compound") {
      if (validSets[0] >= ex.maxReps && validSets.every(r => r >= ex.minReps)) {
        return "🔥 First-Set Trigger Hit! Increase weight by +5–10 lbs next week.";
      }
    } else {
      if (validSets.every(r => r >= ex.maxReps)) {
        return "⚡ Full-Set Mastery! All sets hit max reps — increase weight next week.";
      }
    }
    return "";
  }

  function updateBadgeInPlace(exId) {
    const ex = findEx(exId);
    if (!ex) return;
    const numSets = getSetCount(ex, state.week);
    const msg = checkProgressionText(ex, state.week, numSets);
    const badgeEl = document.getElementById("overload_" + exId);
    if (badgeEl) {
      badgeEl.textContent = msg;
      badgeEl.classList.toggle("show", Boolean(msg));
    }
  }

  function render() {
    document.getElementById("weekSelect").value = String(state.week);
    const info = WEEK_INFO[state.week] || WEEK_INFO[1];
    document.getElementById("phaseBanner").innerHTML =
      "<strong>" + info.note + "</strong><br/>Compounds: " + info.rirComp + " • Isolations: " + info.rirIso;

    document.querySelectorAll(".day-tab").forEach((t, idx) => {
      t.classList.toggle("active", idx === state.day);
    });

    const container = document.getElementById("workoutContainer");
    container.innerHTML = "";
    const dayData = PROGRAM[state.day];

    dayData.exercises.forEach(ex => {
      const numSets = getSetCount(ex, state.week);
      const logKey = "w" + state.week + "_" + ex.id;
      const prevKey = "w" + Math.max(1, state.week - 1) + "_" + ex.id;
      const currentSets = state.logs[logKey] || [];
      const prevSets = state.logs[prevKey] || [];
      const progAlert = checkProgressionText(ex, state.week, numSets);

      let setsHtml = `
        <div class="set-header">
          <div>Set</div>
          <div>Week ${Math.max(1, state.week - 1)}</div>
          <div style="text-align:center">Lbs</div>
          <div style="text-align:center">Reps</div>
          <div style="text-align:center">✓</div>
        </div>
      `;

      for (let i = 0; i < numSets; i++) {
        const cur = currentSets[i] || { weight: "", reps: "", done: false };
        const prev = prevSets[i];
        const prevText = (state.week > 1 && prev && prev.weight && prev.reps)
          ? (prev.weight + " lb × " + prev.reps)
          : ("Target " + ex.minReps + "-" + ex.maxReps);

        setsHtml += `
          <div class="set-row">
            <div class="set-num">${i + 1}</div>
            <div class="prev-log">${prevText}</div>
            <input type="number" inputmode="decimal" placeholder="lbs" value="${cur.weight || ''}"
              data-ex="${ex.id}" data-set="${i}" data-field="weight" />
            <input type="number" inputmode="numeric" placeholder="reps" value="${cur.reps || ''}"
              data-ex="${ex.id}" data-set="${i}" data-field="reps" />
            <button type="button" class="done-btn ${cur.done ? 'checked' : ''}"
              data-action="done" data-ex="${ex.id}" data-set="${i}" data-rest="${ex.rest}">✓</button>
          </div>
        `;
      }

      const showPartials = (state.week >= 6 && state.week <= 7 && ex.type === "isolation");

      const card = document.createElement("div");
      card.className = "ex-card";
      card.innerHTML = `
        <div class="ex-header">
          <div class="ex-name">${ex.name}</div>
          <div class="ex-meta">${numSets} × ${ex.minReps}–${ex.maxReps}</div>
        </div>
        <div class="ex-cue">${ex.cue}</div>
        <div class="badge partials ${showPartials ? 'show' : ''}">⚡ Final Set: Hit 0 RIR, then perform 4–6 Lengthened Partials!</div>
        <div id="overload_${ex.id}" class="badge overload ${progAlert ? 'show' : ''}">${progAlert}</div>
        ${setsHtml}
      `;
      container.appendChild(card);
    });
  }

  function startTimer(sec) {
    clearInterval(timerInterval);
    remainingSeconds = Number(sec) || 0;
    updateTimerUI();
    if (remainingSeconds <= 0) return;
    requestWakeLock();
    timerInterval = setInterval(() => {
      remainingSeconds--;
      updateTimerUI();
      if (remainingSeconds <= 0) {
        clearInterval(timerInterval);
        if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
      }
    }, 1000);
  }

  function updateTimerUI() {
    const m = String(Math.floor(remainingSeconds / 60)).padStart(2, "0");
    const s = String(remainingSeconds % 60).padStart(2, "0");
    document.getElementById("timerDisplay").textContent = m + ":" + s;
  }

  // Event Delegation for all buttons (Never breaks on re-render)
  document.addEventListener("click", function(e) {
    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    const action = btn.getAttribute("data-action");

    if (action === "day") {
      state.day = Number(btn.getAttribute("data-day"));
      saveState();
      render();
    } else if (action === "done") {
      const exId = btn.getAttribute("data-ex");
      const setIdx = Number(btn.getAttribute("data-set"));
      const restSec = Number(btn.getAttribute("data-rest"));
      const key = "w" + state.week + "_" + exId;
      if (!state.logs[key]) state.logs[key] = [];
      if (!state.logs[key][setIdx]) state.logs[key][setIdx] = { weight: "", reps: "", done: false };
      const nextDone = !state.logs[key][setIdx].done;
      state.logs[key][setIdx].done = nextDone;
      btn.classList.toggle("checked", nextDone);
      saveState();
      if (nextDone) startTimer(restSec);
    } else if (action === "timer") {
      startTimer(Number(btn.getAttribute("data-sec")));
    } else if (action === "export") {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "vtaper_backup_w" + state.week + ".json";
      a.click();
    } else if (action === "import") {
      document.getElementById("fileInput").click();
    }
  });

  // Save input values silently as you type without destroying DOM focus
  document.addEventListener("input", function(e) {
    const input = e.target;
    if (!input.matches("input[data-ex]")) return;
    co
